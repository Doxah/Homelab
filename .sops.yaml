# Configuration SOPS du dépôt
# Les clés listées ici sont les clés PUBLIQUES age : elles peuvent être publiées.
# Chaque clé listée peut déchiffrer tous les secrets du dépôt.
# Après ajout ou retrait d'une clé : sops updatekeys <fichier> sur chaque fichier chiffré.

keys:
  - &pc     age1qzy9sc80svgr4nasj395k6kpyxnrauxsxnrml27wgh6h3vlpgu8qs20txs       # poste Windows (édition)
  - &minipc age1gte9plwjskjqaq3d8ejypkj8zjf5drn2qzhmt2taskvqf5cw8v3q39jwfl   # Mini PC (déploiement)

creation_rules:
  # Secrets Kubernetes (plus tard) : seuls data/stringData sont chiffrés, le reste reste lisible
  - path_regex: (^|[\\/])k8s[\\/].*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age: [*pc, *minipc]

  # Tout le reste : fichiers *.sops.env, *.sops.yaml, *.sops.json
  - path_regex: \.sops\.(env|ya?ml|json)$
    key_groups:
      - age: [*pc, *minipc]
