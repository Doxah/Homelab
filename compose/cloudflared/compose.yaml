# cloudflared — UN seul tunnel Cloudflare pour tout le homelab, en sortie uniquement (aucun port ouvert).
# Secrets : secrets.sops.env (TUNNEL_TOKEN). Lancement : scripts/compose-up.sh cloudflared
#
# Chemin : Internet → Cloudflare → cloudflared (réseau proxy) → Traefik (https://traefik:8443) → service.
# Les noms publics (« Public Hostnames ») se déclarent dans le dashboard Zero Trust, chacun vers
#   service = https://traefik:8443   +   TLS › Origin Server Name = le nom public (Traefik est en sniStrict).
# Le trafic du tunnel arrive dans Traefik avec l'IP de ce conteneur : le middleware lan-admin le refuse,
# donc un service d'admin publié par erreur dans le tunnel reste inaccessible depuis Internet.
name: cloudflared

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3     # version figée
    container_name: cloudflared
    restart: unless-stopped                     # les anciens « docker run » ne redémarraient pas après un reboot

    user: "65532:65532"                         # nonroot de l'image distroless
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?secret manquant}

    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks: [proxy]                           # joint Traefik par son nom ; aucun port publié

networks:
  proxy:
    external: true                              # créé par la stack traefik
