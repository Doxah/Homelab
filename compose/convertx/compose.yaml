# ConvertX — conversion de fichiers (https://github.com/C4illin/ConvertX)
# Secrets : secrets.sops.env (JWT_SECRET, DOMAIN). Lancement : scripts/compose-up.sh convertx
# Publié par Traefik (convertx.<DOMAIN>) via le réseau proxy : aucun port publié sur l'hôte.
services:
  convertx:
    image: ghcr.io/c4illin/convertx:v0.19.0   # version figée (Renovate la mettra à jour)
    container_name: convertx
    restart: unless-stopped

    user: "1000:1000"                          # non-root ; ./data doit appartenir à 1000:1000
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp                                   # fichiers temporaires de ffmpeg, LibreOffice…

    mem_limit: 2g                              # LibreOffice et ffmpeg peuvent être gourmands
    cpus: 2.0
    pids_limit: 512

    networks: [proxy]                          # seul réseau : ConvertX n'a besoin de joindre aucun autre conteneur
    labels:
      traefik.enable: "true"
      traefik.http.routers.convertx.rule: Host(`convertx.${DOMAIN:?secret manquant}`)
      traefik.http.services.convertx.loadbalancer.server.port: "3000"
    environment:
      TZ: Europe/Paris
      HOME: /tmp                               # LibreOffice écrit son profil dans $HOME
      ACCOUNT_REGISTRATION: "false"
      JWT_SECRET: ${JWT_SECRET:?secret manquant, lancer via scripts/compose-up.sh}
    volumes:
      - ./data:/app/data                       # données locales, exclues de Git

networks:
  proxy:
    external: true                             # créé par la stack traefik
