# GLPI est toujours servi en HTTPS par le reverse proxy (npmplus), qui lui parle en HTTP.
# Sans ceci, PHP voit une requête HTTP : GLPI génère des redirections en http:// (ex. retour de /ReAuth/Prompt)
# et ne pose pas le flag Secure sur le cookie de session.
# Inconditionnel : le port publié n'est joignable que par le reverse proxy (règle pfSense).
SetEnv HTTPS on
