# Alertes sur les hôtes (Mini PC, pfSense) et sur toute cible injoignable.
# Sévérités : « critique » = notification prioritaire ntfy ; « avertissement » = notification normale.
groups:
  - name: hotes
    rules:
      - alert: CibleInjoignable
        expr: up == 0
        for: 5m
        labels:
          severity: critique
        annotations:
          summary: "{{ $labels.job }} {{ with $labels.nom }}{{ . }}{{ else }}{{ $labels.instance }}{{ end }} ne répond plus"
          description: "Prometheus n'arrive plus à interroger {{ $labels.instance }} (job {{ $labels.job }}) depuis 5 minutes."

      - alert: DisquePresquePlein
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|nullfs|devfs|fdescfs|procfs"}
                   / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|nullfs|devfs|fdescfs|procfs"}) > 85
        for: 10m
        labels:
          severity: avertissement
        annotations:
          summary: "{{ $labels.nom }} : {{ $labels.mountpoint }} rempli à {{ $value | printf \"%.0f\" }} %"
          description: "Faire de la place avant 95 % (l'incident NPM venait d'un disque plein)."

      - alert: DisquePlein
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|nullfs|devfs|fdescfs|procfs"}
                   / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|nullfs|devfs|fdescfs|procfs"}) > 95
        for: 5m
        labels:
          severity: critique
        annotations:
          summary: "{{ $labels.nom }} : {{ $labels.mountpoint }} rempli à {{ $value | printf \"%.0f\" }} %"

      - alert: DisquePleinDans24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|nullfs|devfs|fdescfs|procfs"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.25
        for: 30m
        labels:
          severity: avertissement
        annotations:
          summary: "{{ $labels.nom }} : {{ $labels.mountpoint }} sera plein dans moins de 24 h au rythme actuel"

      - alert: MemoireFaible
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 10m
        labels:
          severity: avertissement
        annotations:
          summary: "{{ $labels.nom }} : seulement {{ $value | printf \"%.0f\" }} % de RAM disponible"

      - alert: ProcesseurSature
        expr: 100 * (1 - avg by (nom, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 15m
        labels:
          severity: avertissement
        annotations:
          summary: "{{ $labels.nom }} : processeur à {{ $value | printf \"%.0f\" }} % depuis 15 minutes"

      - alert: TemperatureElevee
        expr: node_hwmon_temp_celsius > 85
        for: 10m
        labels:
          severity: avertissement
        annotations:
          summary: "{{ $labels.nom }} : capteur {{ $labels.chip }}/{{ $labels.sensor }} à {{ $value | printf \"%.0f\" }} °C"

      - alert: HoteRedemarre
        expr: (time() - node_boot_time_seconds) < 600
        labels:
          severity: avertissement
        annotations:
          summary: "{{ $labels.nom }} a redémarré il y a moins de 10 minutes"
