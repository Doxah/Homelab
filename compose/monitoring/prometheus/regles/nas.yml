# Alertes NAS et switch (SNMP). Codes Synology (SYNOLOGY-*-MIB) :
#   systemStatus / powerStatus : 1 = normal, 2 = panne
#   raidStatus : 1 = normal, 2 à 10 = réparation / migration / synchro…, 11 = dégradé, 12 = planté
#   diskStatus : 1 = normal, 2 = initialisé, 3 = non initialisé, 4 = partition système en échec, 5 = planté
groups:
  - name: nas
    rules:
      - alert: NASEnPanne
        expr: systemStatus{job="snmp-synology"} != 1 or powerStatus{job="snmp-synology"} != 1
        for: 5m
        labels:
          severity: critique
        annotations:
          summary: "Signale une panne système ou d'alimentation"

      - alert: RAIDDegrade
        expr: raidStatus{job="snmp-synology"} >= 11
        for: 5m
        labels:
          severity: critique
        annotations:
          summary: "Le volume {{ $labels.raidName }} est dégradé ou planté (code {{ $value }})"
          description: "Un disque est probablement mort : le remplacer avant qu'un second lâche."

      - alert: RAIDPasNormal
        expr: raidStatus{job="snmp-synology"} != 1 and raidStatus{job="snmp-synology"} < 11
        for: 12h
        labels:
          severity: avertissement
        annotations:
          summary: "Le volume {{ $labels.raidName }} n'est pas revenu à l'état normal depuis 12 h (code {{ $value }})"

      - alert: DisqueNASDefaillant
        expr: diskStatus{job="snmp-synology"} >= 4
        for: 5m
        labels:
          severity: critique
        annotations:
          summary: "Le disque {{ $labels.diskID }} est en échec (code {{ $value }})"

      - alert: DisqueNASChaud
        expr: diskTemperature{job="snmp-synology"} > 50
        for: 30m
        labels:
          severity: avertissement
        annotations:
          summary: "Le disque {{ $labels.diskID }} est à {{ $value }} °C"

      # Volumes de données des NAS (HOST-RESOURCES-MIB, module hr_storage de snmp/homelab.yml)
      - alert: VolumeNASPresquePlein
        expr: |
          100 * hrStorageUsed{hrStorageDescr=~"^/(volume|share).*"}
            / (hrStorageSize{hrStorageDescr=~"^/(volume|share).*"} > 0) > 90
        for: 30m
        labels:
          severity: avertissement
        annotations:
          summary: "Volume {{ $labels.hrStorageDescr }} rempli à {{ $value | printf \"%.0f\" }} %"
