# Configuration SNMP propre au homelab, chargée EN PLUS du snmp.yml fourni par l'image (modules synology, if_mib, dlink…).
# Les ${VAR} des champs username / password / priv_password sont lus dans l'environnement
# (--config.expand-environment-variables) : les identifiants restent dans secrets.sops.env.
auths:
  homelab_v3:                     # SNMPv3, authentification SHA + chiffrement AES (recommandé)
    version: 3
    security_level: authPriv
    username: ${SNMP_V3_USER}
    password: ${SNMP_V3_AUTH_PASSWORD}
    auth_protocol: SHA
    priv_protocol: AES
    priv_password: ${SNMP_V3_PRIV_PASSWORD}
  homelab_v3_des:                 # même compte, pour un équipement qui ne propose que DES (cible : __param_auth)
    version: 3
    security_level: authPriv
    username: ${SNMP_V3_USER}
    password: ${SNMP_V3_AUTH_PASSWORD}
    auth_protocol: SHA
    priv_protocol: DES
    priv_password: ${SNMP_V3_PRIV_PASSWORD}

modules:
  # Espace des volumes (HOST-RESOURCES-MIB, hrStorageTable) : NAS Synology et QNAP.
  # Taille réelle en octets = hrStorageSize * hrStorageAllocationUnits ; pour un pourcentage, Used / Size suffit.
  hr_storage:
    walk:
      - 1.3.6.1.2.1.25.2.3.1.3    # hrStorageDescr
      - 1.3.6.1.2.1.25.2.3.1.4    # hrStorageAllocationUnits
      - 1.3.6.1.2.1.25.2.3.1.5    # hrStorageSize
      - 1.3.6.1.2.1.25.2.3.1.6    # hrStorageUsed
    metrics:
      - name: hrStorageAllocationUnits
        oid: 1.3.6.1.2.1.25.2.3.1.4
        type: gauge
        help: Taille d'une unité d'allocation, en octets - 1.3.6.1.2.1.25.2.3.1.4
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString
      - name: hrStorageSize
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        help: Taille du stockage, en unités d'allocation - 1.3.6.1.2.1.25.2.3.1.5
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString
      - name: hrStorageUsed
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        help: Espace utilisé, en unités d'allocation - 1.3.6.1.2.1.25.2.3.1.6
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString
