# Portabase — tableau de bord de sauvegarde des bases de données (https://portabase.io)
# Secrets : secrets.sops.env (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, PROJECT_SECRET)
#           + compose/commun.sops.env (DOMAIN). Lancement : scripts/compose-up.sh portabase
# Publié par Traefik (portabase.<DOMAIN>) via le réseau proxy : aucun port publié sur l'hôte.
# Données : ./portabase-data (dont les sauvegardes locales) et ./postgres-data. Jamais dans Git.
name: portabase-dashboard

services:
  portabase:
    image: portabase/portabase@sha256:a9678f03c05b1e0c29e89c866e88926131e6b0b2527332eb0e596e65933324fc  # build du 2026-09-29 (digest)
    container_name: portabase-app
    restart: unless-stopped

    # EXCEPTION DOCUMENTÉE : l'image lance nginx, tusd et next-server en root (pas de mode non-root prévu).
    # On limite ce que root peut faire : aucune capacité sauf celles dont nginx/l'entrypoint ont besoin.
    # Si le conteneur ne démarre plus : `docker logs portabase-app`, puis rajouter la capacité citée (une seule à la fois).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]   # nginx écoute sur 80 et change d'utilisateur
    security_opt:
      - no-new-privileges:true

    mem_limit: 1g
    cpus: 1.0
    pids_limit: 300

    environment:
      TZ: Europe/Paris
      POSTGRES_USER: ${POSTGRES_USER:?secret manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?secret manquant}
      POSTGRES_DB: ${POSTGRES_DB:?secret manquant}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PROJECT_URL: https://portabase.${DOMAIN:?secret manquant}
      PROJECT_SECRET: ${PROJECT_SECRET:?secret manquant}   # signe les sessions
      AUTH_SIGNUP_ENABLED: "false"             # inscription fermée (le compte admin existe déjà)
      LOG_LEVEL: info

    volumes:
      - ./portabase-data:/data                 # données du dashboard, dont les sauvegardes en stockage local

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks: [proxy, portabase-backend]       # proxy : Traefik + sorties ; backend : base PostgreSQL
    labels:
      traefik.enable: "true"
      traefik.http.routers.portabase.rule: Host(`portabase.${DOMAIN:?secret manquant}`)
      traefik.http.routers.portabase.middlewares: lan-admin@docker   # outil d'admin : postes d'admin uniquement
      traefik.http.routers.portabase.service: portabase
      # API des agents : authentifiée par la clé de chaque agent, donc sans lan-admin (les agents ne sont pas des postes d'admin)
      traefik.http.routers.portabase-agent.rule: Host(`portabase.${DOMAIN:?secret manquant}`) && PathPrefix(`/api/agent/`)
      traefik.http.routers.portabase-agent.service: portabase
      traefik.http.services.portabase.loadbalancer.server.port: "80"

  db:
    image: postgres:17.11-alpine                # version figée ; ne pas changer de majeure (17) sans pg_upgrade/dump
    container_name: portabase-pg
    restart: unless-stopped

    user: "70:70"                              # postgres de l'image alpine ; ./postgres-data appartient déjà à 70:70
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70      # socket et verrou de postgres

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?secret manquant}
      POSTGRES_USER: ${POSTGRES_USER:?secret manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?secret manquant}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [portabase-backend]              # jamais de port publié

networks:
  portabase-backend:
    internal: true
  proxy:
    external: true                             # créé par la stack traefik
