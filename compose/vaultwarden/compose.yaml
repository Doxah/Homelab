# Vaultwarden : migré du CT LXC (T130) vers le Mini PC.
# Secrets : secrets.sops.env (ADMIN_TOKEN, DOMAIN, BIND_IP). Lancement : scripts/compose-up.sh vaultwarden
# Données : ./data (db.sqlite3 + rsa_key.pem), propriétaire 1000:1000. Jamais dans Git.
# TLS interne : ./tls/cert.pem + key.pem (auto-signé, générés sur le Mini PC, jamais dans Git).
services:
  vaultwarden:
    image: vaultwarden/server:1.37.0           # même version que le CT au moment de la migration
    container_name: vaultwarden
    restart: unless-stopped

    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

    # Publié sur l'IP LAN du Mini PC seulement (BIND_IP, dans les secrets) : le reverse proxy s'y connecte en HTTPS.
    # Une règle pare-feu doit n'autoriser que le reverse proxy vers ce port.
    ports:
      - "${BIND_IP:?secret manquant}:8443:8443"

    environment:
      TZ: Europe/Paris
      ADMIN_TOKEN: ${ADMIN_TOKEN:?secret manquant}
      DOMAIN: ${DOMAIN:?secret manquant}          # https://<url>, IDENTIQUE à l'URL actuelle (WebAuthn/passkeys liés au domaine)
      SIGNUPS_ALLOWED: "false"                    # n'était pas défini dans le CT (défaut = true)
      DATABASE_MAX_CONNS: "10"
      ROCKET_PORT: "8443"                         # > 1024 : pas besoin de CAP_NET_BIND_SERVICE
      ROCKET_TLS: '{certs="/tls/cert.pem",key="/tls/key.pem"}'

    volumes:
      - ./data:/data
      - ./tls:/tls:ro
